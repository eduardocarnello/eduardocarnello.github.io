<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor HTML eproc</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #d9dde3;
    --accent: #1d4ed8;
    --mark-resumo: #fef3c7;
    --mark-disp: #dbeafe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  button, label.chk {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    user-select: none;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.1); color: #fff; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12px; min-width: 90px; text-align: right; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 10px;
    padding: 10px;
    min-height: 0;
  }
  main.so-texto { grid-template-columns: 1fr; }
  main.so-texto #painelCodigo { display: none; }
  .painel {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 0;
    overflow: hidden;
  }
  .painel > .tit {
    padding: 6px 10px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  #codigo {
    flex: 1;
    width: 100%;
    border: 0;
    resize: none;
    padding: 10px;
    font: 12px/1.45 ui-monospace, Consolas, monospace;
    color: #374151;
    outline: none;
  }
  #leitura {
    flex: 1;
    overflow: auto;
    padding: 28px 36px;
    outline: none;
    font-family: "Times New Roman", Times, serif;
    font-size: var(--fs, 17px);
    line-height: 1.6;
    text-align: justify;
  }
  #leitura:empty::before {
    content: "Cole o HTML do eproc no painel ao lado (ou aqui mesmo).";
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 14px;
  }
  #leitura.vazio-sem-codigo:empty::before { content: "Cole o HTML do eproc aqui."; }
  #leitura p { margin: 0 0 0.8em; }
  #leitura .paragrafoPadrao { text-indent: 3em; }
  #leitura .paragrafoComRecuo { margin-left: 3em; }
  #leitura .paragrafoCentralizado, #leitura .titulo, #leitura .subtitulo { text-align: center; text-indent: 0; }
  #leitura .titulo { font-weight: bold; text-transform: uppercase; }
  #leitura .subtitulo { font-weight: bold; }
  #leitura .citacao { margin-left: 4em; font-size: 0.9em; line-height: 1.35; text-indent: 0; }
  #leitura .citacao2 { margin-left: 8em; font-size: 0.9em; line-height: 1.35; text-indent: 0; }
  #leitura table { border-collapse: collapse; margin: 0 0 1em; }
  #leitura td, #leitura th { border: 1px solid #999; padding: 4px 6px; }
  #leitura .widgetlinkdocumento {
    font-family: system-ui, sans-serif;
    font-size: 0.8em;
    padding: 0 5px;
    border: 1px solid #93c5fd;
    border-radius: 4px;
    background: #eff6ff;
    color: #1e40af;
    text-indent: 0;
  }
  #leitura .rodape { vertical-align: super; font-size: 0.7em; color: var(--accent); }
  body.marcas #leitura .resumo { background: var(--mark-resumo); }
  body.marcas #leitura .dispositivo { background: var(--mark-disp); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 30vh 1fr; }
    #leitura { padding: 16px; }
    #leitura .citacao2 { margin-left: 3em; }
  }
</style>
</head>
<body class="marcas">
<header>
  <h1>Leitor HTML eproc</h1>
  <button id="btnColar" class="primary" title="Cola o HTML da área de transferência">Colar</button>
  <button id="btnCopiarHtml" title="Copia o HTML (com as edições) para colar no eproc">Copiar HTML</button>
  <button id="btnCopiarTexto" title="Copia só o texto">Copiar texto</button>
  <button id="btnLimpar">Limpar</button>
  <label class="chk"><input type="checkbox" id="chkMarcas" checked> Destacar resumo/dispositivo</label>
  <label class="chk"><input type="checkbox" id="chkCodigo" checked> Mostrar código</label>
  <button id="btnMenor" title="Diminuir fonte">A−</button>
  <button id="btnMaior" title="Aumentar fonte">A+</button>
  <span class="spacer"></span>
  <span id="status"></span>
</header>
<main id="main">
  <section class="painel" id="painelCodigo">
    <div class="tit">HTML (cole aqui)</div>
    <textarea id="codigo" spellcheck="false" placeholder="Cole aqui o HTML do eproc..."></textarea>
  </section>
  <section class="painel">
    <div class="tit">Texto (leitura e edição direta)</div>
    <div id="leitura" contenteditable="true" spellcheck="true"></div>
  </section>
</main>
<script>
(function () {
  var codigo = document.getElementById('codigo');
  var leitura = document.getElementById('leitura');
  var statusEl = document.getElementById('status');
  var main = document.getElementById('main');
  var CHAVE = 'leitorHtmlEproc.rascunho';
  var fs = 17;

  function status(msg) {
    statusEl.textContent = msg;
    clearTimeout(status.t);
    status.t = setTimeout(function () { statusEl.textContent = ''; }, 2500);
  }

  // Remove cercas de bloco de código (```html ... ```) e elementos perigosos.
  function limpar(html) {
    html = html.trim().replace(/^```[a-zA-Z]*\s*\n?/, '').replace(/\n?```\s*$/, '');
    var doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(function (n) { n.remove(); });
    doc.querySelectorAll('*').forEach(function (el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var v = a.value.replace(/\s/g, '').toLowerCase();
        if (/^on/i.test(a.name) || ((a.name === 'href' || a.name === 'src') && v.indexOf('javascript:') === 0)) {
          el.removeAttribute(a.name);
        }
      });
    });
    return doc.body.innerHTML;
  }

  function salvar() {
    try { localStorage.setItem(CHAVE, codigo.value); } catch (e) {}
  }

  function codigoParaLeitura() {
    leitura.innerHTML = limpar(codigo.value);
    salvar();
  }

  function leituraParaCodigo() {
    codigo.value = leitura.innerHTML;
    salvar();
  }

  var t1, t2;
  codigo.addEventListener('input', function () {
    clearTimeout(t1);
    t1 = setTimeout(codigoParaLeitura, 150);
  });
  leitura.addEventListener('input', function () {
    clearTimeout(t2);
    t2 = setTimeout(leituraParaCodigo, 300);
  });

  // Colar no painel de leitura: se o conteúdo for código HTML em texto puro, renderiza.
  leitura.addEventListener('paste', function (e) {
    var txt = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    if (/^\s*(```|<)/.test(txt) && leitura.textContent.trim() === '') {
      e.preventDefault();
      codigo.value = txt;
      codigoParaLeitura();
      status('HTML carregado');
    }
  });

  function copiar(texto, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { status(msg); }, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); status(msg); } catch (e) { status('Falha ao copiar'); }
      ta.remove();
    }
  }

  document.getElementById('btnColar').onclick = function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      codigo.focus();
      status('Use Ctrl+V');
      return;
    }
    navigator.clipboard.readText().then(function (txt) {
      codigo.value = txt;
      codigoParaLeitura();
      status('HTML carregado');
    }, function () { codigo.focus(); status('Use Ctrl+V'); });
  };
  document.getElementById('btnCopiarHtml').onclick = function () {
    leituraParaCodigo();
    copiar(codigo.value, 'HTML copiado');
  };
  document.getElementById('btnCopiarTexto').onclick = function () {
    var partes = [];
    leitura.querySelectorAll('p, li, h1, h2, h3, h4, tr').forEach(function (el) {
      if (!el.closest('p, li') || el.matches('p, li')) partes.push(el.innerText.trim());
    });
    var texto = partes.length ? partes.filter(Boolean).join('\n\n') : leitura.innerText;
    copiar(texto, 'Texto copiado');
  };
  document.getElementById('btnLimpar').onclick = function () {
    codigo.value = '';
    leitura.innerHTML = '';
    salvar();
    codigo.focus();
  };
  document.getElementById('chkMarcas').onchange = function () {
    document.body.classList.toggle('marcas', this.checked);
  };
  document.getElementById('chkCodigo').onchange = function () {
    main.classList.toggle('so-texto', !this.checked);
    leitura.classList.toggle('vazio-sem-codigo', !this.checked);
  };
  function fonte(d) {
    fs = Math.min(28, Math.max(12, fs + d));
    leitura.style.setProperty('--fs', fs + 'px');
  }
  document.getElementById('btnMenor').onclick = function () { fonte(-1); };
  document.getElementById('btnMaior').onclick = function () { fonte(1); };

  try {
    var r = localStorage.getItem(CHAVE);
    if (r) { codigo.value = r; codigoParaLeitura(); }
  } catch (e) {}
})();
</script>
</body>
</html>
